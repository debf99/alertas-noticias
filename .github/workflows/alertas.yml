name: Alertas de noticias

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alertas
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Revisar noticias y enviar avisos
        env:
          NTFY_PREFIJO: ${{ secrets.NTFY_PREFIJO }}
        run: python alertas.py
      - name: Guardar lo que ya se vio
        run: |
          git config user.name "alertas-bot"
          git config user.email "alertas-bot@users.noreply.github.com"
          git add estado.json
          git diff --cached --quiet || git commit -m "Actualizar estado"
          git push
